## Config file of borgrestore (https://github.com/solisinvictum/borgrestore)
## This file is sourced by bash.

## The path of the Borg repository (local path, NFS mount or ssh://user@host/path)
## Example: BORGREPO="/mnt/nfs/Backups/Borg/myhost"
BORGREPO=""

## Optional: command that prints the passphrase of the repository, e.g.
## BORG_PASSCOMMAND="cat /root/.borg-passphrase"
## Without it, borgrestore asks for the passphrase once (if the repository is encrypted).
#BORG_PASSCOMMAND=""

## Destination where to restore the backups
DESTINATION="/"

## The mount point where to mount the Borg archive (must be empty)
MOUNTPOINT="/mnt/borgmount"

## This is important!!! Write here the same excludes as in Vorta/Borg! If they are not
## the same, rsync deletes everything in the destination that does not exist in the
## source (the backup). These are folders with no real data in it (except /mnt and
## /media maybe, but that would backup/delete external devices too).
## These are rsync patterns (a leading / anchors at DESTINATION), not Borg patterns.
## Check with a dry run first: borgrestore -n -r ARCHIVE
## The mount point and a local repository inside the destination are excluded automatically.
RSYNCEXCLUDES=('/proc' '/mnt' '/sys' '/lost+found' '/dev' '/media' '/tmp' '/run')

## More excludes, e.g. EXTRA_EXCLUDES=('/home/*/.cache' '/var/cache/pacman/pkg')
EXTRA_EXCLUDES=()

## Set "1" if you plan to restore the snapshots while the system is running, or "0"
## if the restore is done "offline". With "0" and DESTINATION="/", the contents of
## /tmp and /run are deleted after a successful restore.
## Do not use "0" on a running system: systemd would no longer know that the system is
## running (no restart/shutdown possible), and under KDE e.g. Kate and Dolphin do not
## start anymore (because of dbus).
LIVESYSTEM="1"
